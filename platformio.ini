; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ESP32-C3 SuperMini driving the MouseVR driver board (Hardware/driver_board).
; The SuperMini has no USB-UART bridge: Serial goes over the native USB CDC,
; which keeps GPIO20/21 (UART0) free.
;
; Display pins follow the driver_board schematic (SuperMini U1 -> J1 header):
;   GPIO0 BL, GPIO1 RST, GPIO3 CLK, GPIO4 CS2 (J3, left),
;   GPIO5 DC, GPIO6 CS1 (J2, right), GPIO7 DIN.
; Both panels share DIN/CLK/DC/RST/BL and differ only in CS, so TFT_CS is -1:
; TFT_eSPI then compiles its CS toggles to nothing and main.cpp selects the
; panel(s) itself through TFT_CS1/TFT_CS2. MULTI_TFT_SUPPORT stops drawPixel
; caching the last address window, which would be stale after a panel switch.
; TFT_BACKLIGHT_ON is deliberately not defined so TFT_eSPI leaves the
; backlight alone and main.cpp can fade it in after the panels are cleared.
[env:esp32-c3-devkitm-1]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DUSER_SETUP_LOADED
	-DGC9D01_DRIVER
	-DTFT_WIDTH=160
	-DTFT_HEIGHT=160
	-DTFT_MOSI=7
	-DTFT_SCLK=3
	-DTFT_CS=-1
	-DTFT_CS1=6
	-DTFT_CS2=4
	-DMULTI_TFT_SUPPORT
	-DTFT_DC=5
	-DTFT_RST=1
	-DTFT_BL=0
	-DTFT_RGB_ORDER=1
	-DTFT_INVERSION_OFF
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	-DSMOOTH_FONT
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
lib_deps =
	lvgl/lvgl@^9.5.0
